services:
  macos:
    image: dockurr/macos
    container_name: macos
    environment:
      VERSION: "13"
      RAM_SIZE: "10G"
      CPU_CORES: "3"
      DISK_SIZE: "28G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "5900:5900/tcp"
      - "5900:5900/udp"
    volumes:
      - ./macos-data:/storage
    restart: on-failure
    stop_grace_period: 2m
